# Winter Game Server - Spring Boot Configuration

# 关闭 Spring Boot 内嵌 Web 服务器（本项目使用 Netty 自行管理网络）
spring.main.web-application-type=none

# 控制 Spring Boot banner 显示
spring.main.banner-mode=log

# MySQL 数据源配置（Spring Boot 自动配置 HikariCP 连接池）
spring.datasource.url=jdbc:mysql://localhost:3306/winter_game
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.hikari.maximum-pool-size=10

# Redis 配置
redis.host=127.0.0.1
redis.port=6379
